name: build
on:
  push:
    branches: ['26.3']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Server smoke test
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p run/world/datapacks && echo "eula=true" > run/eula.txt
          cp .github/datapacks/*.zip run/world/datapacks/ 2>/dev/null || true
          cp .github/datapack-commands.txt run/csl_commands.txt 2>/dev/null || true
          PACKS=$(cd run/world/datapacks && ls *.zip 2>/dev/null | sed 's|^|file/|' | paste -sd, -)
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\ninitial-enabled-packs=vanilla,%s\n' "$PACKS" > run/server.properties
          (timeout 600 ./gradlew runServer > server.log 2>&1 &)
          for i in $(seq 1 120); do
            sleep 5
            if grep -q -E 'Done \(|Exception in server tick loop|Crash report|Mixin apply.*failed|Failed to load datapacks' server.log; then break; fi
          done
          sleep 5; pkill -f runServer || true; pkill -f KnotServer || true
          grep -E 'Done \(' server.log && echo SERVER_OK || echo SERVER_FAILED
      - name: Extract MC sources
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          ./gradlew genSources -q > /dev/null 2>&1 || true
          SJ=$(find ~/.gradle/caches .gradle -name "*minecraft*26.3*sources*.jar" 2>/dev/null | head -1)
          echo "sources: $SJ"
          mkdir -p mcsrc
          for f in $(cat .github/src-files.txt 2>/dev/null); do unzip -o -q -j "$SJ" "$f" -d mcsrc || true; done
          mkdir -p /tmp/allsrc && unzip -o -q "$SJ" -d /tmp/allsrc
          for pat in $(cat .github/grep.txt 2>/dev/null); do echo "### $pat"; grep -rn --include=*.java "$pat" /tmp/allsrc | sed 's|/tmp/allsrc/||' | head -40; done > mcsrc/grep.txt
          for f in $(cat .github/grep-files.txt 2>/dev/null); do cp "/tmp/allsrc/$f" mcsrc/ 2>/dev/null || echo "missing $f" >> mcsrc/grep.txt; done
          MCJ=$(find ~/.gradle/caches -name "minecraft-server*26.3*.jar" -o -name "server-26.3*.jar" | head -1); [ -z "$MCJ" ] && MCJ=$(find ~/.gradle/caches -path "*26.3*" -name "*.jar" | xargs -I{} sh -c 'unzip -l "{}" 2>/dev/null | grep -q " version.json$" && echo "{}"' | head -1)
          unzip -p "$MCJ" version.json > mcsrc/version.json 2>/dev/null || echo "no version.json in $MCJ" > mcsrc/version.json
          ls mcsrc
      - name: Inspect 26.3 API (signatures only)
        run: |
          JAR=$(find ~/.gradle/caches -name "minecraft-*26.3*.jar" ! -name "*sources*" | grep -E "merged|common|minecraft-26" | head -1)
          echo "jar: $JAR" > api.txt
          for c in $(cat .github/api-classes.txt 2>/dev/null); do
            javap -p -cp "$JAR" "$c" >> api.txt 2>&1 || true
          done
      - name: Publish log to ci-logs branch
        run: |
          mkdir /tmp/out && cp build.log api.txt /tmp/out/ && (cp server.log /tmp/out/ || true) && (cp -r mcsrc /tmp/out/ || true)
          echo "${{ steps.build.outcome }} smoke=${{ steps.smoke.outcome }} run ${{ github.run_number }} ${{ github.sha }}" > /tmp/out/status.txt
          cd /tmp/out && git init -q -b ci-logs && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "logs run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
      - name: Release jar
        if: steps.build.outcome == 'success' && steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          J=$(ls build/libs/*.jar | grep -v sources | head -1)
          gh release create "26.3-build-${{ github.run_number }}" "$J" --target "${{ github.sha }}" --title "26.3 build ${{ github.run_number }}" --notes "Automated build" --prerelease
      - name: Fail if build or server test failed
        if: steps.build.outcome != 'success' || steps.smoke.outcome != 'success'
        run: exit 1
