name: build
on:
  push:
    branches: ['26.3']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Server smoke test
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n' > run/server.properties
          (timeout 600 ./gradlew runServer > server.log 2>&1 &)
          for i in $(seq 1 120); do
            sleep 5
            if grep -q -E 'Done \(|Exception in server tick loop|Crash report|Mixin apply.*failed' server.log; then break; fi
          done
          sleep 5; pkill -f runServer || true; pkill -f KnotServer || true
          grep -E 'Done \(' server.log && echo SERVER_OK || echo SERVER_FAILED
      - name: Inspect 26.3 API (signatures only)
        run: |
          JAR=$(find ~/.gradle/caches -name "minecraft-*26.3*.jar" ! -name "*sources*" | grep -E "merged|common|minecraft-26" | head -1)
          echo "jar: $JAR" > api.txt
          for c in $(cat .github/api-classes.txt 2>/dev/null); do
            javap -p -cp "$JAR" "$c" >> api.txt 2>&1 || true
          done
      - name: Publish log to ci-logs branch
        run: |
          mkdir /tmp/out && cp build.log api.txt /tmp/out/ && (cp server.log /tmp/out/ || true)
          echo "${{ steps.build.outcome }} run ${{ github.run_number }} ${{ github.sha }}" > /tmp/out/status.txt
          cd /tmp/out && git init -q -b ci-logs && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "logs run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
      - name: Release jar
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          J=$(ls build/libs/*.jar | grep -v sources | head -1)
          gh release create "26.3-build-${{ github.run_number }}" "$J" --target "${{ github.sha }}" --title "26.3 build ${{ github.run_number }}" --notes "Automated build" --prerelease
      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
