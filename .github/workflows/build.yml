name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: Inspect 26.3 API (signatures only)
        if: always()
        run: |
          JAR=$(find ~/.gradle/caches -name "minecraft-merged*26.3*.jar" -o -name "minecraft-common*26.3*.jar" | grep -v sources | head -1)
          echo "jar: $JAR"
          for c in net.minecraft.world.item.crafting.RecipeManager net.minecraft.world.level.redstone.InstantNeighborUpdater net.minecraft.world.inventory.CraftingMenu net.minecraft.world.item.crafting.CustomRecipe; do
            javap -p -cp "$JAR" $c || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: carpet-shadow-legacy-26.3
          path: build/libs/*.jar
          if-no-files-found: ignore
