name: mcmouser
on:
  push:
    branches: ['mcmouser-26.3']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Extract sources and check mixin targets
        id: check
        continue-on-error: true
        run: |
          ./gradlew genSources -q > /dev/null 2>&1 || true
          SJ=$(find ~/.gradle/caches .gradle -name "*minecraft*26.3*sources*.jar" 2>/dev/null | head -1)
          mkdir -p mcsrc
          for f in net/minecraft/client/MouseHandler.java net/minecraft/client/input/InputQuirks.java; do unzip -o -q -j "$SJ" "$f" -d mcsrc || true; done
          JAR=$(find ~/.gradle/caches -name "minecraft-*26.3*.jar" ! -name "*sources*" | grep -E "merged|client|common" | head -1)
          javap -p -c -cp "$JAR" net.minecraft.client.MouseHandler > mcsrc/MouseHandler.javap.txt 2>&1 || true
          python3 .github/check_targets.py mcsrc/MouseHandler.javap.txt | tee check.txt
      - name: Publish logs
        if: always()
        run: |
          mkdir /tmp/out && cp -r build.log mcsrc /tmp/out/ 2>/dev/null; cp check.txt /tmp/out/ 2>/dev/null || true
          echo "build=${{ steps.build.outcome }} check=${{ steps.check.outcome }} ${{ github.sha }}" > /tmp/out/status.txt
          cd /tmp/out && git init -q -b mcmouser-logs && git add -A && git -c user.name=ci -c user.email=ci@localhost commit -q -m logs
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" mcmouser-logs
      - name: Release
        if: steps.build.outcome == 'success' && steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          J=$(ls build/libs/*.jar | grep -v sources | head -1)
          gh release delete mcmouser-26.3 --yes --cleanup-tag 2>/dev/null || true
          gh release create mcmouser-26.3 "$J" --target "${{ github.sha }}" --title "McMouser for 26.3" --notes "Unofficial port of McMouser (MIT, MinecraftMachina/McMouser) to 26.3." --prerelease
      - name: Fail if needed
        if: steps.build.outcome != 'success' || steps.check.outcome != 'success'
        run: exit 1
